<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PocketSmart AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="mark" aria-hidden="true">₹</span>PocketSmart AI</a>
    <nav aria-label="Main">
      {% if user %}
        <a href="/dashboard">Dashboard</a>
        <a href="/history">History</a>
        <form method="post" action="/logout"><button class="link-btn" type="submit">Log out</button></form>
      {% else %}
        <a href="/login">Sign in</a>
        <a class="btn small" href="/register">Create account</a>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="foot">PocketSmart AI suggests items and prices with Gemini. Prices are estimates, so check the store before you buy.</footer>
  <script src="/static/js/app.js"></script>
</body>
</html>
