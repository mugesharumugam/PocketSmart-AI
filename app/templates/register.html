{% extends "base.html" %}
{% block title %}Create account · PocketSmart AI{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Create your account</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="form">
    <label>Username<input name="username" value="{{ form.get('username', '') }}" autocomplete="username" required autofocus></label>
    <label>Email<input type="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" required></label>
    <label>Password<input type="password" name="password" minlength="6" autocomplete="new-password" required></label>
    <label>Confirm password<input type="password" name="confirm" minlength="6" autocomplete="new-password" required></label>
    <button class="btn" type="submit">Create account</button>
  </form>
  <p>Already have an account? <a href="/login">Sign in</a></p>
</section>
{% endblock %}
